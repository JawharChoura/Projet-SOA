spring:
  application:
    name: api-gateway
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URL:http://localhost:8081/.well-known/jwks.json}
  
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
      routes:
        # Route: Auth Service
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0
        
        # Route: Booking Service - Trajets
        - id: booking-trajets
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/trajets/**
          filters:
            - StripPrefix=0
        
        # Route: Booking Service - Réservations (Protected)
        - id: booking-reservations
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/reservations/**
          filters:
            - StripPrefix=0
        
        # Route: Booking Service - Voyageurs (Protected)
        - id: booking-voyageurs
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/voyageurs/**
          filters:
            - StripPrefix=0
        
        # Route: Health checks (all services)
        - id: health-auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/actuator/health/auth
          filters:
            - RewritePath=/actuator/health/auth, /actuator/health
        
        - id: health-booking
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/actuator/health/booking
          filters:
            - RewritePath=/actuator/health/booking, /actuator/health

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.billetterie.gateway: ${LOGGING_LEVEL_COM_BILLETTERIE:DEBUG}
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

---
# Profile: docker
spring:
  config:
    activate:
      on-profile: docker

logging:
  level:
    root: INFO
    com.billetterie.gateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
