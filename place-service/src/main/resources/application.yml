spring:
  application:
    name: place-service
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:places}
    username: ${DB_USER:place_user}
    password: ${DB_PASSWORD:place_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

# Server Configuration (HTTP pour Actuator)
server:
  port: ${HTTP_SERVER_PORT:8083}
  error:
    include-message: always

# gRPC Server Configuration
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}
    max-inbound-message-size: 1048576  # 1 MB
    enable-reflection: true  # Pour grpcurl (dev only)
    keep-alive-time: 30s
    keep-alive-timeout: 10s
    permit-keep-alive-without-calls: true

# Business Rules
place:
  hold:
    duration-minutes: 10
    release-job-cron: "*/15 * * * * *"  # Every 15 seconds
  availability:
    stream:
      keep-alive-seconds: 20
      buffer-size: 256

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,scheduledtasks
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.billetterie.place: ${LOGGING_LEVEL_COM_BILLETTERIE:DEBUG}
    io.grpc: INFO
    net.devh.boot.grpc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

---
# Profile: docker
spring:
  config:
    activate:
      on-profile: docker

grpc:
  server:
    enable-reflection: false  # Disable in production

logging:
  level:
    root: INFO
    com.billetterie.place: INFO
    io.grpc: WARN
    net.devh.boot.grpc: INFO
