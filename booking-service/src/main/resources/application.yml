spring:
  application:
    name: booking-service
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking}
    username: ${DB_USER:booking_user}
    password: ${DB_PASSWORD:booking_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URL:http://localhost:8081/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true

# Business Rules
booking:
  reservation:
    hold-minutes: ${RESERVATION_HOLD_MINUTES:10}
    max-places: ${MAX_PLACES_PER_RESERVATION:6}
    expiration-job-cron: "*/30 * * * * *"  # Every 30 seconds

# gRPC Client Configuration (place-service)
grpc:
  client:
    place-service:
      address: static://${PLACE_SERVICE_HOST:localhost}:${PLACE_SERVICE_GRPC_PORT:9090}
      negotiationType: PLAINTEXT
      enableKeepAlive: true
      keepAliveTime: 30s
      keepAliveTimeout: 10s
      maxInboundMessageSize: 1048576  # 1 MB

# SOAP Client Configuration (partner-service)
soap:
  partner:
    wsdl-url: ${PARTNER_WSDL_URL:http://localhost:8084/ws/partner?wsdl}
    connection-timeout-ms: ${SOAP_CONNECTION_TIMEOUT_MS:3000}
    read-timeout-ms: ${SOAP_READ_TIMEOUT_MS:5000}

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      partner-service:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: ${CIRCUIT_BREAKER_WAIT_DURATION_SECONDS:10}s
        failure-rate-threshold: ${CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 5s
  
  retry:
    instances:
      place-service:
        max-attempts: ${RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${RETRY_WAIT_DURATION_MS:200}ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,scheduledtasks
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.billetterie.booking: ${LOGGING_LEVEL_COM_BILLETTERIE:DEBUG}
    io.grpc: INFO
    org.springframework.ws: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

---
# Profile: docker
spring:
  config:
    activate:
      on-profile: docker

logging:
  level:
    root: INFO
    com.billetterie.booking: INFO
    io.grpc: WARN
    org.springframework.ws: INFO
